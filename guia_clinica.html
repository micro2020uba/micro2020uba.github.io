<!DOCTYPE html>
<html lang="es-AR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guía clínica</title>
<style>
:root{--paper:#f6f5f1;--ink:#1c2321;--line-soft:#c9c4b8;--panel:#fff;--accent:#2f5d5a;--accent-dark:#1e403d;--muted:#6b6a63;--field:#fbfaf7;--danger:#8a3324}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.tabs{display:flex;gap:6px;padding:10px 12px;border-bottom:2px solid var(--ink);background:var(--panel);position:sticky;top:0;z-index:5;overflow-x:auto}
.tabs button{font:inherit;font-weight:700;font-size:12.5px;padding:7px 12px;border:2px solid var(--ink);background:var(--panel);border-radius:4px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--accent-dark);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px 12px 40px}
.note{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.card{background:var(--panel);border:2px solid var(--ink);border-radius:4px;margin-bottom:12px}
.card>h2{margin:0;font-size:14px;padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between}
.card>h2::after{content:'+';font-family:monospace}.card.open>h2::after{content:'–'}
.card .body{display:none;padding:4px 12px 12px;border-top:1px solid var(--line-soft)}.card.open .body{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:8px 0}
label{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:2px}
label.c{flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-size:13px}
input[type=number],select{font:inherit;padding:6px;border:1px solid var(--ink);border-radius:3px;background:var(--field)}
.res{background:var(--field);border-left:4px solid var(--accent);padding:8px 10px;font-size:13px;min-height:20px}
.res b{font-family:'IBM Plex Mono',monospace}.warn{color:var(--danger);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12.8px;margin-top:6px}
th,td{border:1px solid var(--line-soft);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--field);width:26%;font-size:12px}
.atb th{width:auto}.atb td:first-child{width:24%;font-weight:700}
@media(max-width:560px){th{width:32%}}
.eq{font-size:12px;background:#eef3f2;border:1px dashed var(--accent);padding:7px 10px;margin:8px 0;line-height:1.5}
.eq code{font-family:'IBM Plex Mono',monospace;font-weight:700;display:block;margin:2px 0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar button,.addr{font:inherit;font-weight:700;font-size:12px;padding:6px 10px;border:2px solid var(--ink);background:var(--panel);border-radius:4px;cursor:pointer}
td[contenteditable]{background:#fffbe8;outline:1px dashed var(--accent)}td.x{width:34px;text-align:center}
.res table th,.res table td{font-size:12.5px}.res table th{width:auto}
</style></head><body>
<div class="tabs" id="tabs"></div>
<main><p class="note">Material de apoyo para consulta rápida. Verificá dosis, función renal/hepática y protocolo/antibiograma de tu institución antes de indicar.</p><div id="view"></div></main>
<script>
const n=(k,l,d)=>({k,l,t:'n',d}),s=(k,l,o)=>({k,l,t:'s',o}),c=(k,l)=>({k,l,t:'c'});
const f1=x=>Math.round(x*10)/10;
const CALCS=[
{t:'Child-Pugh y MELD / MELD-Na (cirrosis)',f:[n('bili','Bilirrubina (mg/dL)'),n('alb','Albúmina (g/dL)'),n('inr','RIN (= INR) — así figura en el laboratorio'),n('cr','Creatinina (mg/dL) — MELD'),n('na','Na (mEq/L) — opcional MELD-Na'),s('asc','Ascitis',['Ausente','Leve / controlada','Moderada-severa / refractaria']),s('enc','Encefalopatía',['Ausente','Grado 1-2','Grado 3-4'])],
r:v=>{if([v.bili,v.alb,v.inr].some(isNaN))return'Completá bilirrubina, albúmina y RIN.';
const p=(v.bili<2?1:v.bili<=3?2:3)+(v.alb>3.5?1:v.alb>=2.8?2:3)+(v.inr<1.7?1:v.inr<=2.3?2:3)+v.asc+1+v.enc+1;
const cl=p<=6?'A (sobrevida 1 año ~100%)':p<=9?'B (~80%)':'C (~45%)';let o=`Child-Pugh: <b>${p} pts — clase ${cl}</b>`;
if(!isNaN(v.cr)){const m=Math.round(3.78*Math.log(Math.max(v.bili,1))+11.2*Math.log(Math.max(v.inr,1))+9.57*Math.log(Math.min(Math.max(v.cr,1),4))+6.43);o+=`<br>MELD: <b>${m}</b>`;
if(!isNaN(v.na)){const x=Math.min(Math.max(v.na,125),137);o+=` · MELD-Na: <b>${Math.round(m+1.32*(137-x)-0.033*m*(137-x))}</b>`}}return o}},
{t:'CHA₂DS₂-VASc (fibrilación auricular)',f:[c('a','Insuficiencia cardíaca / disfunción VI (1)'),c('b','Hipertensión (1)'),c('d','Diabetes (1)'),c('e','ACV / AIT / tromboembolia previa (2)'),c('g','Enfermedad vascular: IAM, EAP, placa aórtica (1)'),s('age','Edad',['<65','65-74 (1)','≥75 (2)']),s('sx','Sexo',['Hombre','Mujer (1)'])],
r:v=>{const p=(+v.a)+(+v.b)+(+v.d)+2*v.e+(+v.g)+[0,1,2][v.age]+v.sx;const th=v.sx?3:2;
return`Puntaje: <b>${p}</b> — `+(p>=th?'<span class="warn">anticoagulación indicada</span> (ACOD de elección salvo EM moderada-severa o válvula mecánica)':p==th-1?'considerar anticoagulación (individualizar)':'sin anticoagulación en general')+'. Evaluar riesgo de sangrado (HAS-BLED).'}},
{t:'Wells — TVP',f:[c('a','Cáncer activo'),c('b','Parálisis / inmovilización de MI'),c('d','Reposo ≥3 días o cirugía mayor <12 sem'),c('e','Dolor a lo largo del sistema venoso profundo'),c('g','Todo el miembro edematizado'),c('h','Pantorrilla >3 cm vs contralateral'),c('i','Edema con fóvea (unilateral)'),c('j','Venas colaterales superficiales'),c('k','TVP previa'),c('l','Dx alternativo tan probable como TVP (−2)')],
r:v=>{const p=['a','b','d','e','g','h','i','j','k'].reduce((a,k)=>a+(+v[k]),0)-2*v.l;
return`Puntaje: <b>${p}</b> — `+(p>=3?'<span class="warn">probabilidad ALTA (~75%)</span>: eco-Doppler; si demora, anticoagular empíricamente.':p>=1?'probabilidad MODERADA (~17%): dímero D; si positivo o no disponible → eco-Doppler.':'probabilidad BAJA (~5%): dímero D; si negativo se descarta.')}},
{t:'Síncope — OESIL',f:[c('a','Edad >65 años'),c('b','Antecedente de enfermedad cardiovascular'),c('d','Síncope sin pródromos'),c('e','ECG anormal')],
r:v=>{const p=(+v.a)+(+v.b)+(+v.d)+(+v.e);return`Puntaje: <b>${p}</b> — mortalidad al año: <b>${['0%','0,8%','19,6%','34,7%','57,1%'][p]}</b>. ≥2 → alto riesgo: internación/monitoreo.`}},
{t:'Síncope — EGSYS',f:[c('a','Palpitaciones previas al síncope (+4)'),c('b','ECG anormal y/o cardiopatía (+3)'),c('d','Síncope durante esfuerzo (+3)'),c('e','Síncope en decúbito (+2)'),c('g','Pródromo autonómico: náuseas/vómitos/sudor (−1)'),c('h','Factores predisponentes/precipitantes (−1)')],
r:v=>{const p=4*v.a+3*v.b+3*v.d+2*v.e-v.g-v.h;return`Puntaje: <b>${p}</b> — `+(p>=3?'<span class="warn">≥3: alta probabilidad de causa cardíaca</span> (mortalidad a 2 años ~21% vs 2%). Monitoreo y ecocardiograma.':'<3: baja probabilidad de causa cardíaca.')}},
{t:'IRA — FENa / FEUrea (origen)',f:[n('una','Na urinario (mEq/L)'),n('pna','Na plasmático (mEq/L)'),n('ucr','Creatinina urinaria (mg/dL)'),n('pcr','Creatinina plasmática (mg/dL)'),n('uu','Urea urinaria (mg/dL) — opc.'),n('pu','Urea plasmática (mg/dL) — opc.')],
r:v=>{if([v.una,v.pna,v.ucr,v.pcr].some(isNaN))return'Completá los 4 primeros datos.';const fe=v.una*v.pcr/(v.pna*v.ucr)*100;
let o=`FENa: <b>${Math.round(fe*100)/100}%</b> → `+(fe<1?'prerrenal':fe>2?'renal (NTA)':'indeterminado');
if(!isNaN(v.uu)&&!isNaN(v.pu)){const fu=v.uu*v.pcr/(v.pu*v.ucr)*100;o+=`<br>FEUrea: <b>${f1(fu)}%</b> → `+(fu<35?'prerrenal':'renal')+' (preferir si recibe diuréticos)'}return o+'<br>FENa poco confiable con diuréticos, CKD, glucosuria, contraste.'}},
{t:'Osmolaridad plasmática y urinaria (hiponatremia)',f:[n('na','Na (mEq/L)'),n('glu','Glucemia (mg/dL)'),n('ur','Urea (mg/dL)'),n('uosm','Osm urinaria medida (mOsm/kg) — opc.'),n('una','Na urinario (mEq/L) — opc.')],
r:v=>{if([v.na,v.glu,v.ur].some(isNaN))return'Completá Na, glucemia y urea.';const o=2*v.na+v.glu/18+v.ur/6;
let t=`Osm plasmática calculada: <b>${Math.round(o)} mOsm/kg</b> (`+(o<275?'hipotónica':o>295?'hipertónica':'normal')+')';
if(v.na<135&&o<275&&!isNaN(v.uosm))t+='<br>'+(v.uosm<100?'Osm urinaria <100: polidipsia primaria / bajo aporte de solutos (potomanía, "tea & toast", cerveza).':'Osm urinaria ≥100: ADH activa. '+(!isNaN(v.una)?(v.una<30?'UNa <30: hipovolemia (extrarrenal), ICC, cirrosis.':'UNa >30: SIADH, diuréticos, insuf. suprarrenal, hipotiroidismo, cerebral/renal perdedor de sal. Evaluar volemia clínica.'):'Pedir Na urinario y evaluar volemia.'));
return t}},
{t:'Sodio — reposición en hipo/hipernatremia (Adrogué-Madias)',f:[n('na','Na real (mEq/L)'),n('peso','Peso (kg)'),s('sx','Paciente (factor del agua corporal total)',['Hombre adulto ×0,6','Mujer adulta ×0,5','Hombre anciano ×0,5','Mujer anciana ×0,45']),n('obj','Na objetivo (opcional; si lo dejás vacío: +8 en hipo / −10 en hiper)'),n('h','Horas para corregir (opcional, def. 24)'),n('k','KCl agregado por litro (mEq) — opcional')],
r:v=>{if(isNaN(v.na)||isNaN(v.peso))return'Completá Na real y peso.';const act=v.peso*[.6,.5,.5,.45][v.sx],hipo=v.na<135,hiper=v.na>145;
if(!hipo&&!hiper)return'Na en rango normal (135-145): no requiere reposición.';
const obj=isNaN(v.obj)?(hipo?v.na+8:v.na-10):v.obj,d=obj-v.na,h=v.h||24,k=v.k||0,r24=Math.abs(d)*24/h;
const sols=hipo?[['NaCl 3% (513 mEq/L)',513],['NaCl 0,9% (154 mEq/L)',154]]:[['Dextrosa 5% (0 mEq/L)',0],['NaCl 0,45% (77 mEq/L)',77]];
const rows=sols.map(([nm,na])=>{const dl=(na+k-v.na)/(act+1);if(dl*d<=0)return`<tr><td>${nm}</td><td colspan="3">no corrige en el sentido buscado</td></tr>`;const mL=d/dl*1000;return`<tr><td><b>${nm}</b></td><td>${f1(dl)}</td><td>${Math.round(mL)}</td><td><b>${f1(mL/h)}</b></td></tr>`}).join('');
let o=`${hipo?'Hiponatremia':'Hipernatremia'}: pasar de <b>${v.na}</b> a <b>${f1(obj)}</b> mEq/L en ${h} h (ACT = ${f1(act)} L). Velocidad: <b>${f1(r24)} mEq/L/24 h</b>`+(r24>(hipo?8:12)?` <span class="warn">— supera el límite seguro (${hipo?'≤8':'≤10-12'})</span>`:' (dentro del límite)');
o+=`<table><tr><th>Solución</th><th>Cambia el Na por litro (mEq/L)</th><th>Volumen total (mL)</th><th>Ritmo (mL/h)</th></tr>${rows}</table>`;
if(hiper)o+=`Déficit de agua libre: <b>${f1(act*(v.na/140-1))} L</b>.<br>`;return o+'Controlar Na cada 2-4 h y reajustar el ritmo según el valor real.'}},
{t:'Potasio — ¿cuánto y cómo reponer? (según kalemia)',f:[n('k','K sérico (mEq/L)'),c('ecg','Cambios en ECG / arritmia / debilidad grave'),c('vo','Tolera vía oral'),c('ir','Insuficiencia renal u oliguria')],
r:v=>{if(isNaN(v.k))return'Ingresá el K sérico.';if(v.k>=3.5)return'K ≥3,5: no requiere reposición'+(v.k>5.5?' <span class="warn">(hiperkalemia: ver pestaña Patologías)</span>':'')+'.';
const g=v.k<2.5||v.ecg,m=!g&&v.k<3,cat=g?'GRAVE':m?'MODERADA':'LEVE';
let o=`Hipokalemia <b>${cat}</b> (${v.k} mEq/L)<br>`;
if(g)o+='<b>CARGA</b> EV con monitoreo cardíaco: <b>3 ampollas de ClK en 300 mL de SF en 3 h</b> o <b>4 ampollas en 400 mL de SF en 4 h</b> (≈1 ampolla/h). Agregar <b>1 ampolla de SO₄Mg</b>. Luego <b>MANTENIMIENTO</b>: 1 ampolla de ClK en cada frasco + 1 ampolla de SO₄Mg. Control de K a las 4-6 h de terminar la carga. Si pasás >10 mEq/h: vía central.';
else if(m)o+='EV: <b>1 a 2 ampollas de ClK en cada frasco</b> de hidratación + <b>1 ampolla de SO₄Mg</b>. Control de K cada 6-12 h; si no mejora, pasar a esquema de carga.';
else o+=(v.vo?'<b>Kaon (gluconato de potasio) 15 mL VO</b> c/8-12 h (15 mL ≈ 20 mEq) con las comidas':'EV: <b>1 ampolla de ClK en cada frasco</b>')+'. Alternativa EV: 1 ampolla de ClK por frasco. Control de K en 24 h.';
if(v.ir)o+='<br><span class="warn">Insuficiencia renal/oliguria: reducir la dosis ~50% y controlar K más seguido (riesgo de hiperkalemia).</span>';
o+=`<br>Déficit estimado: ${Math.round((4-v.k)*200)}-${Math.round((4-v.k)*400)} mEq. Siempre corregir el Mg: la hipoK refractaria suele ser hipoMg. Asumí ampolla ClK de 10 mEq/10 mL; verificá la concentración de tu ampolla.`;return o}},
{t:'Calcio corregido por albúmina',f:[n('ca','Calcio total (mg/dL)'),n('alb','Albúmina (g/dL)')],
r:v=>isNaN(v.ca+v.alb)?'Completá los datos.':`Ca corregido: <b>${f1(v.ca+0.8*(4-v.alb))} mg/dL</b> (normal 8,5-10,5). Ideal: medir Ca iónico.`},
{t:'Ritmo diurético',f:[n('v','Diuresis (mL)'),n('p','Peso (kg)'),n('h','Tiempo (horas)')],
r:v=>{if([v.v,v.p,v.h].some(isNaN))return'Completá los datos.';const r=v.v/(v.p*v.h);return`Ritmo diurético: <b>${f1(r*100)/100} mL/kg/h</b> → `+(r<0.5?'<span class="warn">oliguria (<0,5)</span>':r>3?'poliuria':'conservado')}}
,{t:'CURB-65 (gravedad de neumonía)',f:[c('a','Confusión de reciente aparición'),c('b','Urea >43 mg/dL (BUN >19)'),c('d','Frecuencia respiratoria ≥30 /min'),c('e','TA sistólica <90 o diastólica ≤60 mmHg'),c('g','Edad ≥65 años')],
r:v=>{const p=(+v.a)+(+v.b)+(+v.d)+(+v.e)+(+v.g);return`Puntaje: <b>${p}</b> — mortalidad a 30 días ~<b>${['0,7%','2,1%','9,2%','14,5%','40%','57%'][p]}</b><br>`+(p<=1?'Riesgo bajo: tratamiento ambulatorio.':p==2?'<span class="warn">Riesgo intermedio: internación en sala (o corta observación).</span>':p==3?'<span class="warn">Riesgo alto: internación; evaluar UTI.</span>':'<span class="warn">Riesgo muy alto: internación en UTI/cuidados intermedios.</span>')}},
{t:'Glasgow (nivel de conciencia)',f:[s('o','Apertura ocular (O)',['4 Espontánea','3 Al comando verbal','2 Al dolor','1 Ninguna']),s('v','Respuesta verbal (V)',['5 Orientado','4 Confuso','3 Palabras inapropiadas','2 Sonidos incomprensibles','1 Ninguna']),s('m','Respuesta motora (M)',['6 Obedece órdenes','5 Localiza el dolor','4 Retira al dolor','3 Flexión anormal (decorticación)','2 Extensión (descerebración)','1 Ninguna'])],
r:v=>{const o=4-v.o,vv=5-v.v,m=6-v.m,t=o+vv+m;return`Glasgow: <b>${t}</b> (O${o} V${vv} M${m}) — `+(t==15?'normal':t>=13?'TEC/alteración leve':t>=9?'<span class="warn">moderado</span>':'<span class="warn">GRAVE (≤8): considerar proteger la vía aérea / intubación</span>')}},
{t:'Hipoglucemia — nivel y conducta (ampollas de glucosa 25%)',f:[n('g','Glucemia / HGT (mg/dL)'),c('con','Consciente y puede deglutir'),c('via','Tiene acceso venoso')],
r:v=>{if(isNaN(v.g))return'Ingresá la glucemia.';if(v.g>=70)return'Glucemia ≥70: no es hipoglucemia.';const niv=v.g<54?'Nivel 2 (clínicamente significativa)':'Nivel 1 (leve)';let o=`<b>${niv}</b> — glucemia ${v.g} mg/dL (Nivel 3 = grave: necesitó ayuda de otra persona, cualquiera sea el valor).<br>`;
if(v.con)o+='<b>VO: 15-20 g de hidratos de acción rápida</b> (4 tabletas de glucosa, 120 mL de jugo o 1 sobre de azúcar/miel). Repetir HGT a los 15 min; si sigue <70, repetir. Al resolver, dar hidratos complejos + proteínas.';
else if(v.via)o+=(v.g<54?'<b>10 ampollas de glucosa 25% (25 g = 100 mL)</b> EV en bolo (equivale a 50 mL de D50%)':'<b>5 ampollas de glucosa 25% (12,5 g)</b> EV; repetir según HGT')+' <i>(cada ampolla de 10 mL = 2,5 g; cantidades orientativas, ajustar a protocolo)</i>. Alternativa: 100-200 mL de dextrosa 10%. HGT a los 15 min; luego dextrosa 10% de mantenimiento y HGT cada 1 h.';
else o+='<b>Glucagón 1 mg IM/SC</b> (o 3 mg intranasal); repetir a los 15 min si no responde. Conseguir vía y pasar a dextrosa EV. No dar nada por boca.';
return o+'<br>Después: buscar la causa (insulina, sulfonilureas, ayuno, alcohol, sepsis, falla renal/hepática, insuficiencia suprarrenal). Alcoholista/desnutrido: tiamina 100 mg antes de la glucosa.'}}
];

const EQ={
'Child':'<b>RIN</b> = Razón Internacional Normalizada (en inglés <b>INR</b>, <i>International Normalized Ratio</i>); en el laboratorio aparece como “RIN”, debajo del “Tiempo de Protrombina %” (ese % es la actividad, es otro dato y no se usa acá). Normal ≈1; sube si el hígado produce menos factores de coagulación o con anticoagulantes (acenocumarol/warfarina).<code>Child-Pugh = pts(bilirrubina) + pts(albúmina) + pts(RIN) + pts(ascitis) + pts(encefalopatía)</code>Cada ítem da 1, 2 o 3 puntos (peor = más puntos). Total 5-15: <b>A</b> 5-6 (compensada), <b>B</b> 7-9, <b>C</b> 10-15 (descompensada, peor pronóstico).<code>MELD = 3,78·ln(bili) + 11,2·ln(RIN) + 9,57·ln(creat) + 6,43</code>Valores mínimos de 1 (creat máx. 4). Sirve para priorizar el <b>trasplante hepático</b> y estimar mortalidad a 90 días (≥15 se evalúa trasplante). MELD-Na suma el sodio: la hiponatremia empeora el pronóstico.',
'CHA':'<code>Puntaje = ICC 1 + HTA 1 + Edad≥75 2 + Diabetes 1 + ACV/AIT 2 + Vascular 1 + Edad 65-74 1 + Sexo femenino 1</code>Estima el <b>riesgo de ACV embólico</b> en fibrilación auricular no valvular. Hombre ≥2 / mujer ≥3: anticoagular. Un punto menos: considerar. Siempre sopesar con riesgo de sangrado (HAS-BLED).',
'Wells':'<code>Puntaje = suma de criterios (+1 c/u) − 2 si otro diagnóstico es igual o más probable</code>Estima la <b>probabilidad pretest de trombosis venosa profunda</b>. ≤0 baja (~5%), 1-2 moderada, ≥3 alta (~75%). Decide si alcanza con dímero D (baja/moderada) o si va directo a eco-Doppler (alta).',
'Síncope — OESIL':'<code>OESIL = suma de 4 criterios (1 punto c/u)</code>Predice la <b>mortalidad a 1 año</b> tras un síncope de causa no clara: 0 puntos 0%, 1 0,8%, 2 19,6%, 3 34,7%, 4 57,1%. ≥2 = alto riesgo → internación y estudio cardiológico.',
'Síncope — EGSYS':'<code>EGSYS = 4·palpitaciones + 3·ECG/cardiopatía + 3·esfuerzo + 2·decúbito − 1·pródromo autonómico − 1·factores predisponentes</code>Estima la probabilidad de que el síncope sea de <b>origen cardíaco</b>. ≥3 = alto riesgo (mortalidad a 2 años ~21% vs 2%).',
'IRA':'<code>FENa (%) = (Na orina × creat plasma) / (Na plasma × creat orina) × 100</code><code>FEUrea (%) = (urea orina × creat plasma) / (urea plasma × creat orina) × 100</code>Distingue el <b>origen de la insuficiencia renal aguda</b>: FENa <1% → prerrenal (el riñón retiene Na: hipovolemia); >2% → renal (necrosis tubular); 1-2% indeterminado. Con diuréticos usar FEUrea (<35% prerrenal).',
'Osmolaridad':'<code>Osm plasmática = 2 × Na + glucemia/18 + urea/6</code>(glucemia y urea en mg/dL). Mide la concentración de solutos: <275 hipotónica (hiponatremia verdadera), 275-295 normal, >295 hipertónica (ej. hiperglucemia). Osm urinaria <100: el riñón diluye bien (polidipsia); ≥100: hay ADH actuando. Na urinario <30 orienta a hipovolemia extrarrenal/ICC/cirrosis; >30 a SIADH, diuréticos o pérdida renal.',
'Sodio':'<code>Déficit de Na = ACT × (Na objetivo − Na real)      ACT = peso × 0,6 (hombre) / 0,5 (mujer) (0,5 / 0,45 en ancianos)</code><code>Adrogué-Madias: ΔNa por litro = (Na de la solución + K agregado − Na real) / (ACT + 1)</code><code>Volumen (mL) = (Na objetivo − Na real) / ΔNa por litro × 1000      Ritmo (mL/h) = Volumen / horas</code>ACT = agua corporal total (litros). El resultado dice cuánto cambia 1 L de cada solución el Na del paciente y a qué ritmo pasarla. <b>Límite:</b> hiponatremia ≤8 mEq/L/24 h (riesgo de desmielinización osmótica); hipernatremia ≤10-12 mEq/L/24 h (riesgo de edema cerebral). La fórmula es una estimación: controlar Na cada 2-4 h. Déficit de agua libre = ACT × (Na/140 − 1).',
'Potasio':'<code>Déficit estimado ≈ (K deseado 4 − K real) × 200 a 400 mEq</code>Estimación gruesa: cada 1 mEq/L que baja el K equivale a ~200-400 mEq de déficit total. Por eso la conducta se decide por la <b>gravedad</b> (K y ECG): leve → VO o 1 ampolla/frasco; moderada → 1-2 ampollas/frasco + Mg; grave → carga + mantenimiento. Ritmo máximo: 10 mEq/h por vía periférica, 20 mEq/h central con monitoreo.',
'Calcio':'<code>Ca corregido = Ca total + 0,8 × (4 − albúmina)</code>El calcio total baja cuando baja la albúmina (se une a ella) sin que el calcio activo esté bajo. El corregido (normal 8,5-10,5 mg/dL) evita diagnosticar hipocalcemia falsa; lo ideal es medir calcio iónico.',
'Ritmo':'<code>Ritmo diurético (mL/kg/h) = diuresis (mL) / (peso × horas)</code>Normal ≥0,5 mL/kg/h. <0,5 = oliguria (sospechar hipovolemia, IRA, obstrucción). Útil para ajustar hidratación y balance.',
'CURB':'<code>CURB-65 = Confusión + Urea >43 + Respiratoria ≥30 + Presión baja + 65 años (1 punto c/u)</code>Mide la <b>gravedad de la neumonía de la comunidad</b> y ayuda a decidir dónde tratar: 0-1 ambulatorio, 2 sala, ≥3 internación con evaluación de UTI.',
'Glasgow':'<code>Glasgow = Ocular (1-4) + Verbal (1-5) + Motora (1-6)</code>Rango 3-15. 15 normal; 13-14 leve; 9-12 moderado; ≤8 grave (considerar vía aérea definitiva). Se reevalúa seriado; la respuesta motora es la más pronóstica.',
'Hipoglucemia':'<code>Gramos de glucosa = ampollas × 2,5 g (ampolla de 10 mL al 25%)</code>25 g = 10 ampollas = 100 mL de glucosa 25%. Niveles: 1 leve 55-70; 2 &lt;54; 3 grave (requiere asistencia). Seguir con HGT cada 15 min y no considerar resuelta hasta hallar la causa.'};
function eqFor(t){const k=Object.keys(EQ).find(x=>t.startsWith(x));return k?`<div class="eq"><b>Ecuación y cómo interpretarla:</b> ${EQ[k]}</div>`:''}
const P=(t,rows)=>({t,rows});
const PATS=[
P('Hipocalcemia',[['Definición','Ca corregido <8,5 mg/dL (iónico <1,1 mmol/L). Grave: <7,5 o iónico <0,8 / sintomática.'],['Clínica','Parestesias periorales y acras, calambres, tetania, convulsiones, laringoespasmo, QT largo, arritmias; ICC.'],['Examen físico','Signo de Chvostek (percusión del facial) y de Trousseau (manguito 3 min → espasmo carpiano); hiperreflexia; cicatriz cervical (cirugía de tiroides/paratiroides); piel/uñas secas.'],['Laboratorio','Ca total e iónico, albúmina, Mg, P, PTH, 25-OH vitamina D, creatinina, amilasa/lipasa, ECG (QTc).'],['Tratamiento','Sintomática/QTc largo/Ca <7,5: gluconato de Ca 10% 1-2 amp (10-20 mL) en 50-100 mL D5% en 10-20 min con monitoreo; luego infusión: 11 amp en 1 L D5%/SF a 50 mL/h (0,5-1,5 mg/kg/h elemental). Corregir Mg. Asintomática: Ca VO 1-3 g/día elemental + calcitriol/vit D. No mezclar con bicarbonato/fosfato.'],['Interconsulta','Endocrinología (hipoparatiroidismo, PTH), Nefrología (ERC), Terapia si grave/arritmia.']]),
P('Hipercalcemia (antagonista de la anterior)',[['Definición','Ca corregido >10,5. Grave ≥14 o sintomática.'],['Clínica','Poliuria, deshidratación, constipación, náuseas, dolor abdominal, confusión/coma, QT corto.'],['Laboratorio','Ca iónico, PTH (alta → hiperparatiroidismo; baja → neoplasia/otros), PTHrP, vit D, fosfato, creatinina, ECG; Rx tórax; eletroforesis proteica.'],['Tratamiento','SF 200-300 mL/h (objetivo diuresis 100-150 mL/h) · calcitonina 4 UI/kg SC c/12h (1ª 48 h) · ácido zoledrónico 4 mg EV en 15 min (corregir por función renal) · corticoides si granulomatosis/vit D/linfoma. Furosemida solo si sobrecarga. Diálisis si refractaria/ERC.'],['Interconsulta','Endocrinología, Oncología/Hematología, Nefrología.']]),
P('Hiponatremia',[['Definición','Concentración sérica de Na <135 mEq/L.'],['Clasificación por nivel','<b>Leve</b> 130-135 · <b>Moderada</b> 125-129 · <b>Severa</b> &lt;125 mEq/L (los cortes varían según la guía).'],['Por tiempo de evolución','<b>Aguda</b> &lt;48 h · <b>Crónica</b> &gt;48 h. Si se desconoce, considerarla crónica hasta demostrar lo contrario (importante para planificar la corrección).'],['Por volemia (líquido extracelular)','<b>Hipovolémica</b> (VEC disminuido) · <b>Euvolémica</b> (VEC aparentemente normal) · <b>Hipervolémica</b> (VEC aumentado).'],['Por tonicidad (Osm plasmática)','<b>Hipotónica</b> &lt;275 · <b>Isotónica</b> 275-295 · <b>Hipertónica</b> &gt;295 mOsm/kg. Distingue la hiponatremia verdadera de la asociada a hiperglucemia (hipertónica) o la pseudohiponatremia (hiperlipidemia/hiperproteinemia). La urea suma a la osmolalidad pero no es osmol efectivo (no define tonicidad).'],['Orden de evaluación','1) nivel de Na → 2) tonicidad → 3) volemia → 4) tiempo de evolución. Síntomas neurológicos graves = evaluación y tratamiento urgentes.'],['Causas según volemia','<b>Hipovolémica:</b> pérdidas renales (tiazidas, insuficiencia suprarrenal, nefropatía perdedora de sal, diuresis osmótica) o extrarrenales (vómitos, diarrea, tercer espacio, quemaduras). <b>Euvolémica:</b> SIADH (síndrome de secreción inadecuada de ADH), hipotiroidismo, déficit de cortisol, polidipsia primaria, potomanía de cerveza, fármacos (ISRS, carbamazepina). <b>Hipervolémica:</b> insuficiencia cardíaca, cirrosis, síndrome nefrótico, enfermedad renal crónica avanzada.'],['Clínica','<b>Leve:</b> náuseas, cefalea, inestabilidad de la marcha, déficit de atención. <b>Moderada:</b> vómitos, confusión, letargo. <b>Grave:</b> convulsiones, coma, paro respiratorio, edema cerebral.'],['Examen físico','Valorar volemia: mucosas, turgencia, ortostatismo/TA, yugulares/PVC, edemas, ascitis, estertores; peso; fármacos; signos de hipotiroidismo/insuficiencia suprarrenal.'],['Laboratorio','Ionograma, glucemia, urea, creatinina, <b>Osm plasmática</b>, <b>Osm urinaria</b>, <b>Na urinario</b>, ácido úrico, TSH, cortisol, perfil lipídico/proteinograma si se sospecha pseudohiponatremia. Na cada 2-4 h durante la corrección.'],['Tratamiento','<b>Grave/sintomática (cualquier tiempo):</b> NaCl 3% 100-150 mL en 10 min, repetir hasta 3 veces (meta +4-6 mEq/L en las primeras horas). <b>Crónica asintomática:</b> tratar la causa; hipovolémica → SF 0,9%; euvolémica (SIADH) → restricción hídrica ± urea/tolvaptán; hipervolémica → restricción hídrica y de sodio + diurético. <b>Límite: ≤8 mEq/L/24 h</b> (máx 10-12); si hay alto riesgo de desmielinización osmótica (alcoholismo, desnutrición, hipoK, hepatopatía, Na ≤105) apuntar a 4-6. Si se sobrecorrige: dextrosa 5% ± desmopresina 2 mcg EV. Usar la calculadora de Na.'],['Interconsulta','Nefrología; Terapia (grave/convulsiones); Endocrinología (SIADH, suprarrenal, tiroides).']]),
P('Hipernatremia',[['Definición','Na sérico >145 mEq/L.'],['Clasificación por nivel','<b>Leve</b> 146-150 · <b>Moderada</b> 151-159 · <b>Severa</b> ≥160 mEq/L.'],['Por tiempo de evolución','<b>Aguda</b> &lt;48 h · <b>Crónica</b> &gt;48 h (si se desconoce, tratarla como crónica).'],['Por volemia','<b>Hipovolémica</b> (pérdida de agua y de Na: diarrea, vómitos, diuréticos, quemaduras) · <b>Euvolémica</b> (pérdida de agua libre: diabetes insípida, fiebre, hiperventilación) · <b>Hipervolémica</b> (ganancia de Na: NaCl hipertónico, bicarbonato, hiperaldosteronismo).'],['Por tonicidad','Siempre hipertónica (Osm plasmática &gt;295 mOsm/kg).'],['Clínica','Sed, irritabilidad, debilidad, temblor, hiperreflexia, confusión, convulsiones, coma; retracción cerebral con riesgo de hemorragia intracraneal. Grupos de riesgo: ancianos, postrados, intubados, sin acceso al agua.'],['Examen físico','Volemia (mucosas, turgencia, TA, edemas), nivel de conciencia, diuresis, temperatura, acceso a líquidos.'],['Laboratorio','Ionograma, glucemia, urea, creatinina, Ca, <b>Osm plasmática y urinaria</b>, Na urinario, diuresis de 24 h. Osm urinaria baja + poliuria → diabetes insípida (test de desmopresina).'],['Tratamiento','Déficit de agua = ACT × (Na/140 − 1). Reponer preferentemente por VO/SNG; EV con dextrosa 5% o NaCl 0,45%. <b>Crónica:</b> descenso ≤0,5 mEq/L/h y ≤10-12 mEq/L/24 h. <b>Aguda &lt;48 h:</b> puede corregirse más rápido (hasta ~1 mEq/L/h). Hipovolémico con inestabilidad: SF 0,9% primero y luego hipotónicas. Diabetes insípida central: desmopresina; nefrogénica: dieta hiposódica ± tiazida. Hipervolémica: diurético + dextrosa 5%.'],['Interconsulta','Nefrología; Endocrinología (diabetes insípida); Terapia si Na ≥160 o alteración de conciencia.']]),
P('Hipokalemia',[['Definición','K <3,5 mEq/L; moderada 2,5-3; grave <2,5.'],['Clínica','Debilidad, calambres, íleo, rabdomiólisis, poliuria; arritmias (ECG: ondas U, aplanamiento de T, descenso ST).'],['Examen físico','Fuerza muscular, reflejos, TA (hipertensión: hiperaldosteronismo), ruidos hidroaéreos, volemia; pérdidas GI/diuréticos.'],['Laboratorio','K, Mg (siempre), gasometría, K urinario/creatinina, función renal, glucemia, ECG.'],['Tratamiento','Según la kalemia (ver calculadora de potasio): <b>leve</b> → Kaon 15 mL VO o 1 ampolla de ClK en cada frasco; <b>moderada</b> → 1-2 ampollas de ClK en cada frasco + 1 ampolla de SO₄Mg; <b>grave o con ECG alterado</b> → carga de 3 ampollas de ClK en 300 mL de SF en 3 h (o 4 en 400 mL en 4 h) con monitoreo y luego mantenimiento de 1 ampolla de ClK + 1 de SO₄Mg por frasco. Máx. 10 mEq/h periférica, 20 mEq/h central.'],['Interconsulta','Nefrología (pérdida renal), Terapia si grave.']]),
P('Hiperkalemia (antagonistas)',[['Definición','K >5,5 mEq/L; grave ≥6,5 o con cambios ECG.'],['Clínica','Debilidad, parálisis flácida, palpitaciones; ECG: T picudas → PR largo → QRS ancho → sinusoidal/FV.'],['Laboratorio','K (descartar hemólisis), ECG, creatinina, gasometría, CPK, glucemia.'],['Tratamiento','1) Estabilizar membrana: gluconato Ca 10% 10-20 mL EV en 5-10 min (repetir si ECG persiste). 2) Desplazar: insulina regular 10 UI + dextrosa 25-50 g (HGT c/1 h x 6); salbutamol 10-20 mg nebulizado; bicarbonato si acidosis. 3) Eliminar: furosemida, resina/ciclosilicato de Na-Zr, diálisis. Suspender IECA/ARA/espironolactona/AINE.'],['Interconsulta','Nefrología (diálisis), Terapia.']]),
P('Hipoglucemia',[['Definición y niveles','Glucemia &lt;70 mg/dL. <b>Nivel 1 (leve):</b> 55-70, síntomas autonómicos o neuroglucopénicos leves. <b>Nivel 2 (significativa):</b> &lt;54, síntomas neuroglucopénicos evidentes. <b>Nivel 3 (grave):</b> requiere asistencia de otra persona, cualquiera sea el valor.'],['Clínica','Autonómica: temblor, sudor, palpitaciones, hambre, ansiedad. Neuroglucopénica: confusión, alteración de conducta, visión borrosa, convulsión, coma.'],['Examen físico','Conciencia (Glasgow), signos focales (descartar ACV), sitios de inyección de insulina, estigmas de hepatopatía/alcoholismo, signos de insuficiencia suprarrenal, medicación.'],['Paso 1: ¿consciente y puede deglutir?','<b>SÍ:</b> 15-20 g de carbohidratos de acción rápida (4 tabletas de glucosa, 120 mL de jugo, 1 sobre de azúcar/miel). Revalorar a los 15 min; si &lt;70 repetir. Al resolver (≥70): hidratos complejos + proteínas para evitar recaída.<br><b>NO:</b> nada por boca. Ir al paso 2.'],['Paso 2: no deglute — ¿tiene vía venosa?','<b>SÍ:</b> glucosa 25% ampollas de 10 mL (2,5 g c/u): <b>25 g = 10 ampollas (100 mL)</b> en bolo; alternativa 50 mL de D50% o 100-200 mL de dextrosa 10%. En nivel 1 sin posibilidad de VO suele alcanzar con ~5 ampollas (12,5 g), repetir según HGT (orientativo, ajustar a protocolo).<br><b>NO:</b> glucagón 1 mg IM/SC (o 3 mg intranasal); si no responde a los 15 min repetir; conseguir vía.'],['Después del tratamiento','HGT a los 15 min y luego cada 1 h; dextrosa 10% de mantenimiento si recae. ≥70 y sin síntomas = resuelta: buscar la causa, ajustar tratamiento, observar y educar. No se considera resuelta solo porque se normalizó el número.'],['Causas a buscar','Exceso de insulina, sulfonilureas/secretagogos, ayuno o ingesta insuficiente, ejercicio, alcohol, sepsis/enfermedad aguda, insuficiencia renal o hepática, insuficiencia cardíaca/enfermedad crítica, insuficiencia suprarrenal.'],['Laboratorio','HGT y glucemia venosa; si la causa es incierta: insulina, péptido C, cortisol, hepatograma, creatinina, dosaje de sulfonilureas.'],['Señales de alarma','Glucemia &lt;54 con alteración mental, convulsiones, sin respuesta tras 2 ciclos, sospecha de sulfonilureas (octreotide 50 mcg SC/EV c/8 h; internar 24 h) o sobredosis, hipoglucemia recurrente/prolongada. Alcoholista/desnutrido: tiamina 100 mg antes de la glucosa.'],['Errores frecuentes','No confirmar la glucemia; no revalorar a los 15 min; omitir el aporte alimentario posterior; dar el alta sin identificar la causa; suspender insulina en diabetes tipo 1 sin plan de ajuste.'],['Interconsulta','Endocrinología/Nutrición; Toxicología si sulfonilureas; Terapia si no responde.']])
];
const ATB=[
P('Infecciones de piel y partes blandas',[['Erisipela / celulitis no purulenta','Cefalexina 500 mg c/6 h VO (o amoxi-clav) · EV: cefazolina 1-2 g c/8 h','5-7 días. Elevar miembro, tratar puerta de entrada.'],['Purulenta / absceso (SAMR comunitario)','Drenaje + TMP-SMX 160/800 mg c/12 h VO o clindamicina 300-450 mg c/8 h','5-7 días. ATB si >5 cm, fiebre o comorbilidad.'],['Grave / sepsis cutánea','Vancomicina 15-20 mg/kg c/8-12 h (ajustar nivel/renal) o linezolid 600 mg c/12 h ± pip-tazo 4,5 g c/6 h','Hemocultivos; lactato.'],['Necrotizante (alarma: dolor desproporcionado, crepitación, bullas)','Pip-tazo + vancomicina + clindamicina 600-900 mg c/8 h','CIRUGÍA URGENTE; interconsulta Cirugía + Infectología.']]),
P('ITU',[['Cistitis aguda no complicada','Nitrofurantoína 100 mg c/6 h x 5 d, o fosfomicina 3 g única; TMP-SMX x 3 d si resistencia local <20%','Evitar nitrofurantoína si ClCr <30-45.'],['Pielonefritis ambulatoria','Ciprofloxacina 500 mg c/12 h x 7 d o ceftriaxona 1 g/24 h y luego VO','Urocultivo previo siempre.'],['ITU complicada / pielonefritis internada','Ceftriaxona 1-2 g/24 h (si sin riesgo de BLEE (bacterias productoras de β-lactamasas de espectro extendido)). Con riesgo de BLEE (bacterias productoras de β-lactamasas de espectro extendido)/shock: meropenem 1 g c/8 h o ertapenem 1 g/24 h','7 d (10-14 si respuesta lenta). Eco/TAC si no mejora en 48-72 h (obstrucción, absceso).'],['ITU intrahospitalaria / asociada a sonda','Pip-tazo 4,5 g c/6-8 h o cefepime 2 g c/8-12 h; meropenem si BLEE; amikacina 15 mg/kg/d alternativa','Recambiar/retirar sonda. No tratar bacteriuria asintomática.']]),
P('Neumonías',[['NAC ambulatoria sin comorbilidades','Amoxicilina 1 g c/8 h','5 días. CURB-65 para decidir internación.'],['NAC ambulatoria con comorbilidades','Amoxi-clav 875/125 c/12 h + azitromicina 500 mg/d, o levofloxacina 750 mg/d','5-7 días.'],['NAC internación en sala','Ceftriaxona 1-2 g/24 h + azitromicina 500 mg/d (o levofloxacina 750 mg/d)','Mín. 5 días y afebril 48 h. Cultivos, antígenos urinarios (neumococo/Legionella).'],['NAC grave (UTI)','Ceftriaxona 2 g + azitromicina 500 mg (o FQ). Riesgo Pseudomonas: pip-tazo/cefepime/meropenem + ciprofloxacina. Riesgo SAMR: + vancomicina o linezolid','7 d. Considerar corticoides en NAC grave.'],['Asociada a cuidados de la salud','Hoy se trata según factores de riesgo de bacterias multirresistentes (MDR) (ATB EV previo 90 d, colonización, inmunosupresión, hospitalización reciente): sin riesgo → esquema NAC; con riesgo → pip-tazo/cefepime/meropenem ± SAMR','Cultivos antes de ATB.'],['Intrahospitalaria / NAV (≥48 h)','Pip-tazo 4,5 g c/6 h, cefepime 2 g c/8 h o meropenem 1 g c/8 h + vancomicina/linezolid si riesgo de SAMR (<i>Staphylococcus aureus</i> resistente a meticilina) (+ 2º antipseudomonal si shock/MDR local)','7 d. Desescalar con cultivo.']]),
P('Clostridioides difficile',[['1er episodio','Fidaxomicina 200 mg c/12 h x 10 d (preferida) o vancomicina 125 mg c/6 h VO x 10 d; metronidazol 500 mg c/8 h solo si no hay otra opción (no grave)','Suspender ATB inductor, aislamiento de contacto, lavado con agua y jabón, sin antidiarreicos.'],['Fulminante (shock, íleo, megacolon)','Vancomicina 500 mg c/6 h VO/SNG + metronidazol 500 mg c/8 h EV ± vancomicina rectal','Cirugía (colectomía) + Infectología urgente.'],['Recurrencia','Vancomicina en pulsos/descenso o fidaxomicina; considerar bezlotoxumab o trasplante de microbiota','Dx: GDH + toxina / PCR.']]),
P('Pseudomonas aeruginosa',[['Tratamiento dirigido (sensible)','Pip-tazo 4,5 g c/6 h (infusión extendida), cefepime 2 g c/8 h, ceftazidima 2 g c/8 h, meropenem 1 g c/8 h, ciprofloxacina 400 mg c/8-12 h EV','Según antibiograma. Combinar (β-lactámico + aminoglucósido/FQ) solo en shock empírico, desescalar a las 48-72 h.'],['Multirresistente (MDR) / extremadamente resistente (XDR)','Ceftolozano-tazobactam, ceftazidima-avibactam, colistina/polimixina B (combinada) según sensibilidad','Interconsulta con Infectología.']])
];
const SUG='Sugerencias para una próxima ampliación: sepsis/shock séptico, meningitis, ICC descompensada, TEP, SCA, EPOC exacerbado, cetoacidosis diabética, HDA, pancreatitis, colangitis, diverticulitis, HTA severa.';
function fieldHtml(i,f){const id=`c${i}_${f.k}`;
if(f.t==='n')return`<label>${f.l}<input type="number" step="any" inputmode="decimal" data-k="${f.k}" id="${id}"></label>`;
if(f.t==='s')return`<label>${f.l}<select data-k="${f.k}">${f.o.map((x,j)=>`<option value="${j}">${x}</option>`).join('')}</select></label>`;
return`<label class="c"><input type="checkbox" data-k="${f.k}">${f.l}</label>`}
function renderCalcs(){const v=document.getElementById('view');v.innerHTML=CALCS.map((x,i)=>`<div class="card" data-i="${i}"><h2>${x.t}</h2><div class="body">${eqFor(x.t)}<div class="grid">${x.f.map(f=>fieldHtml(i,f)).join('')}</div><div class="res">Completá los datos.</div></div></div>`).join('');
v.querySelectorAll('.card').forEach(card=>{const x=CALCS[card.dataset.i];
const run=()=>{const o={};card.querySelectorAll('[data-k]').forEach(e=>{o[e.dataset.k]=e.type==='checkbox'?e.checked:e.tagName==='SELECT'?+e.value:parseFloat(e.value)});card.querySelector('.res').innerHTML=x.r(o)};
card.querySelector('h2').onclick=()=>card.classList.toggle('open');card.addEventListener('input',run);run();})}
function renderTables(list,cls){const v=document.getElementById('view');v.innerHTML=list.map(p=>`<div class="card"><h2>${p.t}</h2><div class="body"><table class="${cls}">${cls?'<tr><th>Escenario</th><th>Esquema</th><th>Duración / notas</th></tr>':''}${p.rows.map(r=>'<tr>'+r.map((c,j)=>j==0&&!cls?`<th>${c}</th>`:`<td>${c}</td>`).join('')+'</tr>').join('')}</table></div></div>`).join('')+(cls?'':`<p class="note">${SUG}</p>`);
v.querySelectorAll('.card h2').forEach(h=>h.onclick=()=>h.parentNode.classList.toggle('open'))}

const ATB_KEY='guia_atb_v1';let EDIT=false;
const DRUGS=/(ceftazidima-avibactam|ceftolozano-tazobactam|polimixina B|amoxi-clav|pip-tazo|TMP-SMX|cefalexina|cefazolina|amoxicilina|clindamicina|vancomicina|linezolid|nitrofurantoína|fosfomicina|ciprofloxacina|ceftriaxona|meropenem|ertapenem|cefepime|ceftazidima|amikacina|azitromicina|levofloxacina|fidaxomicina|colistina|bezlotoxumab)/gi;
const boldD=t=>t.replace(DRUGS,'<b>$1</b>');
const atbLoad=()=>{try{const s=localStorage.getItem(ATB_KEY);if(s)return JSON.parse(s)}catch(e){}return ATB.map(p=>({t:p.t,rows:p.rows.map(r=>[r[0],boldD(r[1]),r[2]])}))};
const atbSave=d=>{try{localStorage.setItem(ATB_KEY,JSON.stringify(d))}catch(e){}};
const collect=()=>[...document.querySelectorAll('#view .card')].map(c=>({t:c.querySelector('h2 span').textContent,rows:[...c.querySelectorAll('tr.dr')].map(tr=>[...tr.querySelectorAll('td[data-c]')].map(td=>td.innerHTML))}));
function renderATB(d){d=d||atbLoad();const v=document.getElementById('view'),ce=EDIT?' contenteditable="true"':'';
v.innerHTML=`<div class="bar"><button id="ed">${EDIT?'✔ Listo':'✏️ Editar esquemas'}</button>${EDIT?'<button id="np">+ Nueva infección/patología</button><button id="rs">Restablecer original</button>':''}<span class="note" style="margin:0">${EDIT?'Tocá una celda para escribir (Ctrl+B = negrita). Se guarda solo, en este navegador/dispositivo.':'Los antibióticos recomendados van en <b>negrita</b>. Podés editar esquemas y días de tratamiento.'}</span></div>`+d.map((p,i)=>`<div class="card open" data-i="${i}"><h2><span>${p.t}</span></h2><div class="body"><table class="atb"><tr><th>Escenario</th><th>Esquema (antibióticos)</th><th>Días de tratamiento / observaciones</th>${EDIT?'<th></th>':''}</tr>${p.rows.map((r,j)=>`<tr class="dr">${r.map((c,k)=>`<td data-c="${k}"${ce}>${c}</td>`).join('')}${EDIT?`<td class="x"><button class="addr" data-del="${i},${j}">✕</button></td>`:''}</tr>`).join('')}</table>${EDIT?`<p><button class="addr" data-add="${i}">+ Agregar fila</button></p>`:''}</div></div>`).join('');
v.querySelectorAll('h2').forEach(x=>x.onclick=()=>x.parentNode.classList.toggle('open'));
v.oninput=()=>{if(EDIT)atbSave(collect())};
document.getElementById('ed').onclick=()=>{if(EDIT)atbSave(collect());EDIT=!EDIT;renderATB()};
if(EDIT){document.getElementById('np').onclick=()=>{const n=prompt('Nombre de la infección o patología:');if(!n)return;const x=collect();x.push({t:n,rows:[['Escenario','<b>Antibiótico</b> y dosis','Días']]});atbSave(x);renderATB(x)};
document.getElementById('rs').onclick=()=>{if(confirm('¿Borrar tus cambios y volver al contenido original?')){localStorage.removeItem(ATB_KEY);renderATB()}};
v.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const x=collect();x[+b.dataset.add].rows.push(['Escenario','<b>Antibiótico</b> y dosis','Días']);atbSave(x);renderATB(x)});
v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.del.split(',');const x=collect();x[+i].rows.splice(+j,1);atbSave(x);renderATB(x)})}}
const GLOS=[['RIN / INR','Razón Internacional Normalizada (International Normalized Ratio): tiempo de protrombina estandarizado; mide la coagulación (normal ≈1). En tu laboratorio figura como RIN.'],['ATB','Antibiótico'],['ITU','Infección del tracto urinario'],['NAC','Neumonía adquirida en la comunidad'],['NAV','Neumonía asociada a ventilación mecánica'],['MDR','Multirresistente: resistente a ≥1 antibiótico de ≥3 familias'],['XDR','Extremadamente resistente: sensible a solo 1-2 familias de antibióticos'],['SAMR','<i>Staphylococcus aureus</i> resistente a meticilina'],['BLEE','β-lactamasas de espectro extendido: enzimas bacterianas que inactivan penicilinas y cefalosporinas'],['FQ','Fluoroquinolonas (ciprofloxacina, levofloxacina)'],['TMP-SMX','Trimetoprima-sulfametoxazol'],['pip-tazo','Piperacilina-tazobactam'],['amoxi-clav','Amoxicilina-ácido clavulánico'],['ClK / SO₄Mg','Cloruro de potasio / sulfato de magnesio'],['SF','Solución fisiológica (NaCl 0,9%)'],['VO / EV / IM / SC','Vía oral / endovenosa / intramuscular / subcutánea'],['ACT','Agua corporal total'],['VEC','Volumen extracelular'],['SIADH','Síndrome de secreción inadecuada de hormona antidiurética'],['FENa / FEUrea','Fracción excretada de sodio / de urea'],['HGT','Hemoglucotest (glucemia capilar)'],['ACOD','Anticoagulantes orales de acción directa'],['IRA / ERC','Insuficiencia renal aguda / enfermedad renal crónica'],['ICC','Insuficiencia cardíaca congestiva'],['ECG / QTc','Electrocardiograma / intervalo QT corregido'],['TVP / TEP','Trombosis venosa profunda / tromboembolismo pulmonar']];
const TABS=[['Scores y cálculos',renderCalcs],['Patologías y electrolitos',()=>renderTables(PATS,'')],['Antibióticos',()=>renderATB()],['Glosario',()=>renderTables([P('Abreviaturas y siglas',GLOS)],'')]];
const tb=document.getElementById('tabs');
TABS.forEach(([n,fn],i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{tb.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn();window.scrollTo(0,0)};tb.appendChild(b)});
tb.firstChild.click();
</script></body></html>
