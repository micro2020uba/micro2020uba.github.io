<!DOCTYPE html>
<html lang="es-AR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guía clínica</title>
<style>
:root{--paper:#f6f5f1;--ink:#1c2321;--line-soft:#c9c4b8;--panel:#fff;--accent:#2f5d5a;--accent-dark:#1e403d;--muted:#6b6a63;--field:#fbfaf7;--danger:#8a3324}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 'IBM Plex Sans','Segoe UI',Arial,sans-serif}
.tabs{display:flex;gap:6px;padding:10px 12px;border-bottom:2px solid var(--ink);background:var(--panel);position:sticky;top:0;z-index:5;overflow-x:auto}
.tabs button{font:inherit;font-weight:700;font-size:12.5px;padding:7px 12px;border:2px solid var(--ink);background:var(--panel);border-radius:4px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--accent-dark);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px 12px 40px}
.note{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.card{background:var(--panel);border:2px solid var(--ink);border-radius:4px;margin-bottom:12px}
.card>h2{margin:0;font-size:14px;padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between}
.card>h2::after{content:'+';font-family:monospace}.card.open>h2::after{content:'–'}
.card .body{display:none;padding:4px 12px 12px;border-top:1px solid var(--line-soft)}.card.open .body{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:8px 0}
label{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:2px}
label.c{flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-size:13px}
input[type=number],select{font:inherit;padding:6px;border:1px solid var(--ink);border-radius:3px;background:var(--field)}
.res{background:var(--field);border-left:4px solid var(--accent);padding:8px 10px;font-size:13px;min-height:20px}
.res b{font-family:'IBM Plex Mono',monospace}.warn{color:var(--danger);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12.8px;margin-top:6px}
th,td{border:1px solid var(--line-soft);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--field);width:26%;font-size:12px}
.atb th{width:auto}.atb td:first-child{width:24%;font-weight:700}
@media(max-width:560px){th{width:32%}}
</style></head><body>
<div class="tabs" id="tabs"></div>

{t:'Child-Pugh y MELD / MELD-Na (cirrosis)',f:[n('bili','Bilirrubina (mg/dL)'),n('alb','Albúmina (g/dL)'),n('inr','INR'),n('cr','Creatinina (mg/dL) — MELD'),n('na','Na (mEq/L) — opcional MELD-Na'),s('asc','Ascitis',['Ausente','Leve / controlada','Moderada-severa / refractaria']),s('enc','Encefalopatía',['Ausente','Grado 1-2','Grado 3-4'])],

{t:'CHA₂DS₂-VASc (fibrilación auricular)',f:[c('a','Insuficiencia cardíaca / disfunción VI (1)'),c('b','Hipertensión (1)'),c('d','Diabetes (1)'),c('e','ACV / AIT / tromboembolia previa (2)'),c('g','Enfermedad vascular: IAM, EAP, placa aórtica (1)'),s('age','Edad',['<65','65-74 (1)','≥75 (2)']),s('sx','Sexo',['Hombre','Mujer (1)'])],

{t:'Wells — TVP',f:[c('a','Cáncer activo'),c('b','Parálisis / inmovilización de MI'),c('d','Reposo ≥3 días o cirugía mayor <12 sem'),c('e','Dolor a lo largo del sistema venoso profundo'),c('g','Todo el miembro edematizado'),c('h','Pantorrilla >3 cm vs contralateral'),c('i','Edema con fóvea (unilateral)'),c('j','Venas colaterales superficiales'),c('k','TVP previa'),c('l','Dx alternativo tan probable como TVP (−2)')],

{t:'Síncope — OESIL',f:[c('a','Edad >65 años'),c('b','Antecedente de enfermedad cardiovascular'),c('d','Síncope sin pródromos'),c('e','ECG anormal')],
r:v=>{const p=(+v.a)+(+v.b)+(+v.d)+(+v.e);return`Puntaje: <b>${p}</b> — mortalidad al año: <b>${['0%','0,8%','19,6%','34,7%','57,1%'][p]}</b>. ≥2 → alto riesgo: internación/monitoreo.`}},
{t:'Síncope — EGSYS',f:[c('a','Palpitaciones previas al síncope (+4)'),c('b','ECG anormal y/o cardiopatía (+3)'),c('d','Síncope durante esfuerzo (+3)'),c('e','Síncope en decúbito (+2)'),c('g','Pródromo autonómico: náuseas/vómitos/sudor (−1)'),c('h','Factores predisponentes/precipitantes (−1)')],

{t:'IRA — FENa / FEUrea (origen)',f:[n('una','Na urinario (mEq/L)'),n('pna','Na plasmático (mEq/L)'),n('ucr','Creatinina urinaria (mg/dL)'),n('pcr','Creatinina plasmática (mg/dL)'),n('uu','Urea urinaria (mg/dL) — opc.'),n('pu','Urea plasmática (mg/dL) — opc.')],

{t:'Osmolaridad plasmática y urinaria (hiponatremia)',f:[n('na','Na (mEq/L)'),n('glu','Glucemia (mg/dL)'),n('ur','Urea (mg/dL)'),n('uosm','Osm urinaria medida (mOsm/kg) — opc.'),n('una','Na urinario (mEq/L) — opc.')],
r:v=>{if([v.na,v.glu,v.ur].some(isNaN))return'Completá Na, glucemia y urea.';const o=2*v.na+v.glu/18+v.ur/6;

{t:'Sodio — reposición (hipo/hipernatremia): déficit + Adrogué',f:[n('na','Na real (mEq/L)'),n('obj','Na objetivo (mEq/L)'),n('peso','Peso (kg)'),s('sx','ACT (agua corporal total)',['Hombre adulto ×0,6','Mujer adulta ×0,5','Hombre anciano ×0,5','Mujer anciana ×0,45']),s('sol','Solución',['NaCl 3% (513)','NaCl 0,9% (154)','NaCl 0,45% (77)','Dextrosa 5% (0)']),n('k','KCl agregado (mEq/L de solución)'),n('h','Horas de infusión (def. 24)')],
r:v=>{if([v.na,v.obj,v.peso].some(isNaN))return'Completá Na real, objetivo y peso.';const act=v.peso*[.6,.5,.5,.45][v.sx],inf=[513,154,77,0][v.sol]+(v.k||0),h=v.h||24,d=v.obj-v.na;
const dl=(inf-v.na)/(act+1);let o=`ACT: <b>${f1(act)} L</b> · Déficit/exceso de Na: <b>${Math.round(act*d)} mEq</b>`;

{t:'Potasio — déficit estimado',f:[n('k','K sérico (mEq/L)'),n('o','K objetivo (def. 4)')],
r:v=>{if(isNaN(v.k))return'Ingresá el K.';const o=v.o||4,d=o-v.k;if(d<=0)return'K en rango u objetivo menor al actual.';return`Déficit estimado: <b>${Math.round(d*200)}–${Math.round(d*400)} mEq</b> (≈200-400 mEq por cada 1 mEq/L). Reponer parcialmente (~50%) y reevaluar K.<br>Máx. EV: 10 mEq/h por vía periférica (≤40 mEq/L) y hasta 20 mEq/h por vía central con monitoreo. Corregir Mg (hipoMg → hipoK refractaria).`}},

];

P('Hipocalcemia',[['Definición','Ca corregido <8,5 mg/dL (iónico <1,1 mmol/L). Grave: <7,5 o iónico <0,8 / sintomática.'],['Clínica','Parestesias periorales y acras, calambres, tetania, convulsiones, laringoespasmo, QT largo, arritmias; ICC.'],['Examen físico','Signo de Chvostek (percusión del facial) y de Trousseau (manguito 3 min → espasmo carpiano); hiperreflexia; cicatriz cervical (cirugía de tiroides/paratiroides); piel/uñas secas.'],['Laboratorio','Ca total e iónico, albúmina, Mg, P, PTH, 25-OH vitamina D, creatinina, amilasa/lipasa, ECG (QTc).'],['Tratamiento','Sintomática/QTc largo/Ca <7,5: gluconato de Ca 10% 1-2 amp (10-20 mL) en 50-100 mL D5% en 10-20 min con monitoreo; luego infusión: 11 amp en 1 L D5%/SF a 50 mL/h (0,5-1,5 mg/kg/h elemental). Corregir Mg. Asintomática: Ca VO 1-3 g/día elemental + calcitriol/vit D. No mezclar con bicarbonato/fosfato.'],['Interconsulta','Endocrinología (hipoparatiroidismo, PTH), Nefrología (ERC), Terapia si grave/arritmia.']]),

P('Hiponatremia',[['Definición','Na <135 mEq/L. Grave <125 o sintomática. Aguda <48 h / crónica ≥48 h.'],['Clínica','Leve: náuseas, cefalea, mareo. Grave: confusión, convulsiones, coma, edema cerebral.'],['Examen físico','Valorar VOLEMIA: mucosas, turgencia, PVC/yugulares, TA y ortostatismo, edemas, ascitis, estertores; fármacos (tiazidas, ISRS), hipotiroidismo.'],['Laboratorio','Osm plasmática (excluir pseudo e hipertónica: glucemia), ionograma urinario y Osm urinaria, Na urinario, urea/ácido úrico, TSH, cortisol, ionograma seriado cada 2-4 h al corregir.'],['Tratamiento','Grave/sintomática: NaCl 3% 100-150 mL en 10 min, repetir hasta 3 veces (meta +4-6 mEq/L en las 1ªs horas). Crónica asintomática: tratar causa; hipovolémica → SF; euvolémica (SIADH) → restricción hídrica ± urea/tolvaptán; hipervolémica → restricción + diurético. LÍMITE: ≤8 mEq/L/24 h (máx 10-12). Si sobrecorrige: dextrosa 5% ± desmopresina 2 mcg EV.'],['Interconsulta','Nefrología; Terapia (grave); Endocrinología (SIADH/insuficiencia suprarrenal).']]),

P('Neumonías',[['NAC ambulatoria sin comorbilidades','Amoxicilina 1 g c/8 h','5 días. CURB-65 para decidir internación.'],['NAC ambulatoria con comorbilidades','Amoxi-clav 875/125 c/12 h + azitromicina 500 mg/d, o levofloxacina 750 mg/d','5-7 días.'],['NAC internación en sala','Ceftriaxona 1-2 g/24 h + azitromicina 500 mg/d (o levofloxacina 750 mg/d)','Mín. 5 días y afebril 48 h. Cultivos, antígenos urinarios (neumococo/Legionella).'],['NAC grave (UTI)','Ceftriaxona 2 g + azitromicina 500 mg (o FQ). Riesgo Pseudomonas: pip-tazo/cefepime/meropenem + ciprofloxacina. Riesgo SAMR: + vancomicina o linezolid','7 d. Considerar corticoides en NAC grave.'],['Asociada a cuidados de la salud','Hoy se trata según factores de riesgo para MDR (ATB EV previo 90 d, colonización, inmunosupresión, hospitalización reciente): sin riesgo → esquema NAC; con riesgo → pip-tazo/cefepime/meropenem ± SAMR','Cultivos antes de ATB.'],['Intrahospitalaria / NAV (≥48 h)','Pip-tazo 4,5 g c/6 h, cefepime 2 g c/8 h o meropenem 1 g c/8 h + vancomicina/linezolid si riesgo SAMR (+ 2º antipseudomonal si shock/MDR local)','7 d. Desescalar con cultivo.']]),

const SUG='Sugerencias para una próxima ampliación: sepsis/shock séptico, meningitis, ICC descompensada, TEP, SCA, EPOC exacerbado, cetoacidosis diabética, HDA, pancreatitis, colangitis, diverticulitis, HTA severa.';
function fieldHtml(i,f){const id=`c${i}_${f.k}`;
if(f.t==='n')return`<label>${f.l}<input type="number" step="any" inputmode="decimal" data-k="${f.k}" id="${id}"></label>`;
if(f.t==='s')return`<label>${f.l}<select data-k="${f.k}">${f.o.map((x,j)=>`<option value="${j}">${x}</option>`).join('')}</select></label>`;
return`<label class="c"><input type="checkbox" data-k="${f.k}">${f.l}</label>`}
function renderCalcs(){const v=document.getElementById('view');v.innerHTML=CALCS.map((x,i)=>`<div class="card" data-i="${i}"><h2>${x.t}</h2><div class="body"><div class="grid">${x.f.map(f=>fieldHtml(i,f)).join('')}</div><div class="res">Completá los datos.</div></div></div>`).join('');
v.querySelectorAll('.card').forEach(card=>{const x=CALCS[card.dataset.i];
const run=()=>{const o={};card.querySelectorAll('[data-k]').forEach(e=>{o[e.dataset.k]=e.type==='checkbox'?e.checked:e.tagName==='SELECT'?+e.value:parseFloat(e.value)});card.querySelector('.res').innerHTML=x.r(o)};
card.querySelector('h2').onclick=()=>card.classList.toggle('open');card.addEventListener('input',run);run();})}
function renderTables(list,cls){const v=document.getElementById('view');v.innerHTML=list.map(p=>`<div class="card"><h2>${p.t}</h2><div class="body"><table class="${cls}">${cls?'<tr><th>Escenario</th><th>Esquema</th><th>Duración / notas</th></tr>':''}${p.rows.map(r=>'<tr>'+r.map((c,j)=>j==0&&!cls?`<th>${c}</th>`:`<td>${c}</td>`).join('')+'</tr>').join('')}</table></div></div>`).join('')+(cls?'':`<p class="note">${SUG}</p>`);
v.querySelectorAll('.card h2').forEach(h=>h.onclick=()=>h.parentNode.classList.toggle('open'))}
const TABS=[['Scores y cálculos',renderCalcs],['Patologías y electrolitos',()=>renderTables(PATS,'')],['Antibióticos',()=>renderTables(ATB,'atb')]];
const tb=document.getElementById('tabs');
TABS.forEach(([n,fn],i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{tb.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn();window.scrollTo(0,0)};tb.appendChild(b)});
tb.firstChild.click();
</script></body></html>
